name: Tests

on:
  push:
    branches: [tsx, native]
  pull_request:
    branches: [tsx, native]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: /bin/bash test.sh

      - name: Prepare coverage for deployment
        if: github.event_name == 'push' && (github.ref == 'refs/heads/tsx' || github.ref == 'refs/heads/native')
        run: /bin/bash .github/workflows/prepare-ghpages.sh

      - name: Setup Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/tsx' || github.ref == 'refs/heads/native')
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/tsx' || github.ref == 'refs/heads/native')
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/tsx' || github.ref == 'refs/heads/native')
        id: deployment
        uses: actions/deploy-pages@v4
